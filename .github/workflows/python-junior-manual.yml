name: Python junior manual tests
on:
  push:
    paths:
      - 'python-junior-manual/**'
      - '.github/workflows/python-junior-manual.yml'
  pull_request:
    paths:
      - 'python-junior-manual/**'
      - '.github/workflows/python-junior-manual.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-junior-manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app exercises tests
      - name: Tests
        run: python -m pytest -q
